{% extends "base.html" %}
{% block content %}
<section class="auth">
  <h1>Passwort vergessen</h1>
  <p>Ein Passwortreset ersetzt nicht den zweiten Anmeldeschritt. Konten mit Authenticator-App benötigen danach weiterhin die App oder einen Wiederherstellungscode.</p>
  <form method="post" novalidate>{% csrf_token %}{{ form.as_div }}<button type="submit">Link anfordern</button></form>
</section>
{% endblock %}
