{% extends "base.html" %}
{% block content %}
<section class="auth">
  {% if validlink %}
    <h1>Neues Passwort setzen</h1>
    <form method="post" novalidate>{% csrf_token %}{{ form.as_div }}<button type="submit">Passwort speichern</button></form>
  {% else %}
    <h1>Link ungültig</h1>
    <p>Dieser Link ist ungültig oder wurde bereits verwendet. <a href="{% url 'account:password_reset' %}">Neuen Link anfordern</a>.</p>
  {% endif %}
</section>
{% endblock %}
